name: release

# 打标签即发布：构建 npm 包并把 tgz 附到 Release，别人可以用一条命令安装。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
